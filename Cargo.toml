[package]
name = "prioritizer"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["datepicker"] }
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
hostname = "0.4.2"
jiff = { version = "0.2.38", features = ["serde"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4", "serde", "v5"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
egui_system_font_provider = "0.37.0"
tempfile = "3.27.0"
