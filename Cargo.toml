# The desktop app (this folder) and its data side without UI (core/), which
# other front ends can share. Both have the same version: scripts/release.sh
# bumps the one below.
[workspace]
members = [".", "core"]
# `cargo test` / `cargo clippy` at the top cover both.
default-members = [".", "core"]

[workspace.package]
version = "1.0.10"
edition = "2024"
authors = ["Andreas Zoglauer"]
license = "Apache-2.0"
repository = "https://github.com/zoglauer/priogator"

[package]
name = "priogator"
version.workspace = true
edition.workspace = true
description = "A priority tracker"
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
priogator-core = { path = "core" }
directories = "6.0.0"
# Only the parts we use; the renderer is chosen per platform below.
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "wayland", "x11"] }
egui_extras = { version = "0.37.0", default-features = false, features = ["datepicker"] }
egui_system_font_provider = "0.37.0"
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
jiff = { version = "0.2.38", features = ["serde"] }
rfd = "0.17.2"
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4", "serde", "v5"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Draws with Metal.
eframe = { version = "0.37.0", default-features = false, features = ["wgpu"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Draws with OpenGL; much smaller than wgpu on Linux.
eframe = { version = "0.37.0", default-features = false, features = ["glow"] }

# `cargo deb` (cargo install cargo-deb) builds a Debian/Ubuntu package on Linux:
# target/debian/priogator_<version>_<arch>.deb. Libraries it needs are found
# by $auto; the rest are opened at run time, so they're listed by hand.
[package.metadata.deb]
maintainer = "Andreas Zoglauer"
copyright = "Andreas Zoglauer"
license-file = ["LICENSE", "0"]
section = "utils"
# No Debian revision ("-1"): every change gets a new version anyway.
revision = ""
extended-description = """\
A personal to-do list with areas (columns), deadlines that move tasks to the \
top, and easy re-prioritizing. Local only: computers sync through a shared \
folder (e.g. Syncthing), no accounts, no server."""
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libwayland-egl1, libx11-6, libxcursor1, libxrandr2, libxi6, libgl1, libegl1, libfontconfig1"
recommends = "xdg-desktop-portal"
assets = [
    ["target/release/priogator", "usr/bin/", "755"],
    ["assets/priogator.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/1024x1024/apps/priogator.png", "644"],
    ["README.md", "usr/share/doc/priogator/", "644"],
    ["HELP.md", "usr/share/doc/priogator/", "644"],
    ["assets/third-party-licenses.txt", "usr/share/doc/priogator/", "644"],
]
