[package]
name = "priogator-core"
version.workspace = true
edition.workspace = true
description = "Priogator's data: board, sync files, settings, backups (no UI)"
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
directories = "6.0.0"
hostname = "0.4.2"
jiff = { version = "0.2.38", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4", "serde", "v5"] }

[dev-dependencies]
tempfile = "3.27.0"
